name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Choose deployment target'
        required: true
        type: choice
        options:
          - pypi
          - testpypi

jobs:
  test:
    name: Run Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: uv sync --dev
      - name: Execute test suite
        run: uv run pytest tests/

  build:
    name: Build Distribution
    needs: test  # This forces the build to wait for tests to pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Package
        run: uv build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist/
      - uses: astral-sh/setup-uv@v5
      - name: Publish to TestPyPI
        run: uv publish --publish-url https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to Real PyPI
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist/
      - uses: astral-sh/setup-uv@v5
      - name: Publish to PyPI
        run: uv publish