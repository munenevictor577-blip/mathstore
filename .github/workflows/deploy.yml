name: Deploy Mathstore to GCP

on:
  push:
    branches:
      - server
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Execute Deployment Commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd /srv/apps/mathstore

            # 1. Force sync with the remote server branch
            git fetch --all
            git reset --hard origin/server
            git pull origin server

            # 2. Sync dependencies using uv
            ~/.local/bin/uv sync

            # 3. Restart the background service
            sudo systemctl restart mathstore