[project]
name = "mathstore"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mark", email = "pythondev677@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "sympy>=1.14.0",
]

[project.scripts]
mathstore = "mathstore.cli:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

