[project]
name = "mathstore"
version = "0.1.1a1"
description = "A clean, modular mathematical toolkit."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "mark", email = "munenevictor577@gmail.com" }
]
requires-python = ">=3.12"
keywords = [
    "math",
    "calculus",
    "linear-algebra",
    "statistics",
    "fastapi",
    "education",
    "active-recall",
    "edtech",
    "sympy",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Education",
]
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "sympy>=1.14.0",
    "uvicorn[standard]>=0.53.0",
]

[project.urls]
Homepage = "https://github.com/munenevictor577-blip/mathstore"
Documentation = "https://github.com/munenevictor577-blip/mathstore#readme"
Repository = "https://github.com/munenevictor577-blip/mathstore"
Issues = "https://github.com/munenevictor577-blip/mathstore/issues"
Changelog = "https://github.com/munenevictor577-blip/mathstore/blob/main/RELEASE_NOTES.md"

[project.scripts]
mathstore = "mathstore.cli:main"
mathstore-server = "mathstore.api.main:run"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

